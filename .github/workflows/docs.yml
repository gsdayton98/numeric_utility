name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev doxygen graphviz

      - name: Build documentation
        run: |
          cmake -S . -B build -DBUILD_TESTING=OFF -DNUMERIC_UTILITY_DOCS=ON
          cmake --build build --target docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  # Publish only from main. Enable Pages with source "GitHub Actions" in the repository settings.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
